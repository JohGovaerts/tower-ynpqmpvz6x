    <div class="desc">${esc(tr('Small changes that even out the armies or soften the siege. They are not in the rulebook; the whole table should agree.'))}</div>
    ${Object.keys(HOUSE_RULES).map(k => `<label class="row hr-row" style="gap:10px;align-items:flex-start"><input type="checkbox" data-hr="${k}" ${hr[k] ? 'checked' : ''}><span><b>${esc(HOUSE_RULES[k].name)}</b><br><span class="muted">${esc(tr(HOUSE_RULES[k].tip))}</span></span></label>`).join('')}</details>`;
  const n = ARMY_ORDER.filter(a => setupState.seats[a] !== 'off').length;
  const hum = ARMY_ORDER.filter(a => setupState.seats[a] === 'human').length + (setupState.castleCtrl === 'human' ? 1 : 0);
  h += `<div class="opt-block"><div class="label">${LANG.cur === 'nl' ? 'Dobbelstenen' : 'Dice'}</div><div class="seg">${[['app', LANG.cur === 'nl' ? 'De app gooit' : 'The app rolls'], ['real', LANG.cur === 'nl' ? 'Echte dobbelstenen' : 'Real dice']].map(([k, l]) => `<button data-dice="${k}" aria-pressed="${(setupState.physical ? 'real' : 'app') === k}">${l}</button>`).join('')}</div>
    <div class="desc">${esc(tr('With real dice, every roll for a player\'s own units and cards is yours to throw: the app tells you which dice to roll and you tap in what came up. Rolls between AI armies and the app-run castle stay automatic.'))}</div></div>`;
  h += `<div class="setup-actions"><button class="btn primary block" id="start" ${n ? '' : 'disabled'}>Storm the castle${n ? ` · ${n} ${n === 1 ? 'army (solo rules)' : 'armies'}${hum > 1 ? ', pass & play' : ''}` : ''}</button>
    <div class="grid2"><button class="btn" id="loadb">📂 ${LANG.cur === 'nl' ? 'Spel laden' : 'Load a game'}</button><button class="btn" id="recb">📊 ${LANG.cur === 'nl' ? 'Resultaten' : 'Record'}</button></div>
    <div class="grid2"><button class="btn" id="rules">Rules & glossary</button><button class="btn" id="about">About this app</button></div></div>`;
  $('#setup').innerHTML = h;
  $('#setup').querySelectorAll('[data-a]').forEach(b => b.onclick = () => { readNames(); setupState.seats[b.dataset.a] = b.dataset.c; persistSetup(); renderSetup(); });
  $('#setup').querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { readNames(); setLang(b.dataset.lang); renderSetup(); });
  $('#setup').querySelectorAll('[data-dc]').forEach(b => b.onclick = () => { readNames(); setupState.castleCtrl = b.dataset.dc; persistSetup(); renderSetup(); });
  $('#setup').querySelectorAll('[data-castle]').forEach(b => b.onclick = () => { readNames(); setupState.castle = b.dataset.castle; persistSetup(); renderSetup(); });
  $('#intro').onchange = e => { setupState.intro = e.target.checked; persistSetup(); };
  $('#setup').querySelectorAll('[data-hr]').forEach(c => c.onchange = () => { readNames(); setupState.house = { ...(setupState.house || {}), [c.dataset.hr]: c.checked }; persistSetup(); renderSetup(); });
  $('#start').onclick = () => { readNames(); persistSetup(); startNew(); };
  $('#rules').onclick = showRules; $('#about').onclick = showAbout;
  $('#loadb').onclick = showLoadSlots; $('#recb').onclick = showRecord;
  $('#setup').querySelectorAll('[data-dice]').forEach(b => b.onclick = () => { readNames(); setupState.physical = b.dataset.dice === 'real'; persistSetup(); renderSetup(); });
  $('#tutb').onclick = () => { readNames(); persistSetup(); startTutorial(); };
  const r = $('#resume'); if (r) r.onclick = () => resumeGame(sv);
}
function readNames() { for (const a of ARMY_ORDER) { const i = $('#nm-' + a); if (i) setupState.names[a] = i.value.trim(); } const c = $('#nm-castle'); if (c) setupState.castleName = c.value.trim(); }
function persistSetup() { try { localStorage.setItem('stc_setup', JSON.stringify(setupState)); } catch (e) { } }

function enterGameScreen() {
  $('#setup').hidden = true; $('#game').hidden = false;
  buildBoardStatic();
  UIX.mode = 'idle'; UIX.panelFn = null; UIX.onBoard = null; UIX.sel = null; UIX.skip = false; UIX.holder = null; clearHL();
  TUT_RUN = {};
}
function startNew() {
  GEN++;
  RNG = Math.random;
  const seats = [0, 1, 2, 3].map(i => { const a = ARMY_ORDER[i]; return { army: a, ctrl: setupState.seats[a], name: setupState.names[a] || '' }; });
  let k = 1; for (const s of seats) if (s.ctrl === 'human' && !s.name) s.name = 'Player ' + (k++);
  newGame({ seats, castle: setupState.castle, intro: setupState.intro, house: { ...(setupState.house || {}) }, physical: !!setupState.physical, defHuman: setupState.castleCtrl === 'human' ? (setupState.castleName || 'Castle') : null });
  enterGameScreen();
  runLoop();
}
function resumeGame(sv) {
  GEN++;
  S = sv;
  if (!S.v || S.v < 2) { alert('This saved game is from an older version and can\'t be resumed. Please start a new game.'); clearSave(); renderSetup(); return; }
  enterGameScreen();
  log('Game resumed.');
  runLoop();
}
async function runLoop() {
  const gen = GEN;
  render();
  try { await runGame(); }
  catch (e) { if (e instanceof Aborted) return; console.error(e); log('Something went wrong: ' + e.message, 'kill'); UIX.skip = false; render(); return; }
  if (gen !== GEN) return;
  UIX.skip = false;
  if (S.over) { if (S.opts.tutorial) { S.over = false; await tut('end'); S.over = true; } showEnd(); }
}
function showEnd() {
  clearSave();
  recordGame();
  render();
  const w = S.winner;
  let h;
  if (w !== 'D') h = `<h2 style="color:${armyColor(w)}">${esc(ARMIES[S.seats[w].army].name)} take the Keep!</h2><p style="margin:0">${esc(seatName(w))} wins on turn ${S.turn}.</p>`;
  else {
    const sc = finalScores();
    h = `<h2>The castle holds</h2><p style="margin:0" class="muted">Nobody reached the Keep by the end of turn 8. The vilest invader is decided on points: walls destroyed, sets of 3 defenders slain, heroes, champion and upgrade in play, sets of 3 units, every 3 gold, and the Boss.</p>
      <table class="scores">${sc.map((x, i) => `<tr><td>${i === 0 ? '🏆' : ''}</td><td style="color:${armyColor(x.s)}">${esc(seatName(x.s))}</td><td class="muted">${ARMIES[S.seats[x.s].army].short}</td><td class="num" style="text-align:right"><b>${x.sc}</b></td></tr>`).join('')}</table>`;
  }
  const rec = readRecord();
  const recLine = S.players.filter(isHuman).map(s => { const a = S.seats[s].army, x = rec.armies[a]; return x ? `${ARMIES[a].short}: ${x.won}/${x.played} ${LANG.cur === 'nl' ? 'gewonnen' : 'won'}` : ''; }).filter(Boolean).join(' · ');
  if (recLine) h += `<p class="muted" style="margin:0;font-size:13px">📊 ${esc(recLine)}${S.opts.defHuman ? ` · 🏰 ${rec.castle.won}/${rec.castle.played}` : ''}</p>`;
  const sh = sheet(`${h}<div class="grid2"><button class="btn primary" id="again">Play again</button><button class="btn" id="board2">See the board</button></div>`);
  sh.el.querySelector('#again').onclick = () => { sh.close(); startNew(); };
  sh.el.querySelector('#board2').onclick = () => { sh.close(); $('#panel').innerHTML = `<button class="btn primary block" id="nb">New game</button><div>${recentLog(14)}</div>`; $('#nb').onclick = toSetup; };
}
function toSetup() { GEN++; UIX.panelFn = null; UIX.onBoard = null; UIX.skip = false; document.querySelectorAll('.scrim,.handoff').forEach(e => e.remove()); $('#game').hidden = true; $('#setup').hidden = false; renderSetup(); }

function showMenu() {
  const sh = sheet(`<h2>Menu</h2>
    <div style="display:grid;gap:8px">
      <button class="act" id="mr"><b>Rules & glossary</b><small>Turn structure, combat, ladders, walls and every term.</small></button>
      <button class="act" id="ml"><b>Battle log</b><small>Everything that happened so far.</small></button>
      <button class="act" id="ms"><b>Speed: ${PREF.speed}</b><small>How long AI moves, dice and events stay on screen.</small></button>
      <button class="act" id="mh"><b>Guidance: ${PREF.hints ? 'on' : 'off'}</b><small>Show the yellow guide boxes and the explanation under each action.</small></button>
      <button class="act" id="msk"><b>Save Skeletons automatically: ${PREF.autoSkel === false ? 'off' : 'on'}</b><small>When your Skeletal Warriors die and you have 3 magic, pay it to flip them instead.</small></button>
      ${Object.keys(ART.map).length ? `<button class="act" id="mart"><b>Custom art: ${PREF.art === false ? 'off' : 'on'}</b><small>${Object.keys(ART.map).length} of your own picture files were found in the assets folder. Turn off to compare with the built-in look.</small></button>` : ''}
      <button class="act" id="mlang"><b>${LANG.cur === 'nl' ? 'Uitleg: Nederlands' : 'Explanations: English'}</b><small>${LANG.cur === 'nl' ? 'Tik om tooltips en uitleg in het Engels te tonen.' : 'Tap to show tooltips and explanations in Dutch.'}</small></button>
      <button class="act" id="msv"><b>${LANG.cur === 'nl' ? 'Opslaan in een slot' : 'Save to a slot'}</b><small>${LANG.cur === 'nl' ? 'Bewaar dit spel om later verder te spelen (3 slots).' : 'Keep this game to continue later (3 slots).'}</small></button>
      <button class="act" id="mdice"><b>${S && S.opts.physical ? (LANG.cur === 'nl' ? 'Dobbelstenen: echte' : 'Dice: real dice') : (LANG.cur === 'nl' ? 'Dobbelstenen: de app' : 'Dice: the app rolls')}</b><small>${LANG.cur === 'nl' ? 'Met echte dobbelstenen gooien spelers zelf voor hun eigen eenheden en kaarten en tikken ze het resultaat in.' : 'With real dice, players roll for their own units and cards and tap in the result.'}</small></button>
      <button class="act" id="mq"><b>Quit to setup</b><small>Your game is saved at the last phase and can be resumed.</small></button>
    </div><button class="btn block" id="mc">Close</button>`, { dismiss: true });
  const q = id => sh.el.querySelector(id);
  q('#mr').onclick = () => { sh.close(); showRules(); };
  q('#ml').onclick = () => { sh.close(); showLog(); };
  q('#ms').onclick = () => { cycleSpeed(); sh.close(); showMenu(); };
  q('#mh').onclick = () => { PREF.hints = !PREF.hints; savePrefs(); document.body.classList.toggle('hints-off', !PREF.hints); sh.close(); showMenu(); };
  q('#mq').onclick = () => { sh.close(); toSetup(); };
  q('#msk').onclick = () => { PREF.autoSkel = PREF.autoSkel === false; savePrefs(); sh.close(); showMenu(); };
  if (q('#mart')) q('#mart').onclick = () => { PREF.art = PREF.art === false; savePrefs(); document.body.classList.toggle('has-art', PREF.art !== false); sh.close(); refreshArt(); showMenu(); };
  q('#msv').onclick = () => { sh.close(); showSaveSlots(); };
  q('#mdice').onclick = () => { if (S) S.opts.physical = !S.opts.physical; setupState.physical = !!(S && S.opts.physical); persistSetup(); sh.close(); showMenu(); };
  q('#mlang').onclick = () => { setLang(LANG.cur === 'nl' ? 'en' : 'nl'); sh.close(); render(); showMenu(); };
  q('#mc').onclick = sh.close;
}
function setLang(l) { LANG.cur = l === 'nl' ? 'nl' : 'en'; PREF.lang = LANG.cur; savePrefs(); document.documentElement.lang = LANG.cur; }
function showRules() {
  const nl = LANG.cur === 'nl';
  const house = S && S.opts && S.opts.house ? Object.keys(HOUSE_RULES).filter(k => S.opts.house[k]) : [];
  const phases = nl ? [
    ['Collect', '5 goud (max 10), magie voor Arcanists/Undead, trek een Power Card.'],
    ["Who's the Boss?", 'geheime goudbiedingen bovenop je stemmen. De Boss krijgt Boss-kaarten en kiest de beurtvolgorde.'],
    ['Buy & Deploy', 'koop eenheden, ladders, kaarten en uitrusting; roep je Champion op met zijn kaart; zet daarna je eenheden op je startvakken.'],
    ['Reinforcements', 'nieuwe verdedigers verschijnen; het aantal Events voor deze beurt ligt vast.'],
    ['Player turns', 'rond elke beurt worden Events onthuld. Beweeg met je 5 legerzetten, val aan, speel kaarten. Sommige kaarten speel je op speciale momenten; de app vraagt het je.'],
    ['Wrap up', 'leg af tot 3 kaarten, de verdedigers herstellen.'],
  ] : [
    ['Collect', '5 gold (max 10), magic for Arcanists/Undead, draw a Power Card.'],
    ["Who's the Boss?", 'secret gold bids on top of your votes. The Boss gets Boss cards and picks turn order.'],
    ['Buy & Deploy', 'buy units, ladders, cards and gear; summon your Champion with its card; then place units on your start spaces.'],
    ['Reinforcements', 'new defenders appear; the number of Events this turn is set.'],
    ['Player turns', 'Events are revealed around each turn. Move with your 5 Army Moves, attack, play cards. Some cards are played at special moments; the app asks you.'],
    ['Wrap up', 'discard down to 3 cards, defenders recover.'],
  ];
  const sh = sheet(`<h2>${nl ? 'Zo speel je' : 'How to play'}</h2>
    <p style="margin:0">${nl ? 'Elke spelbeurt doorloopt deze fasen. Je wint door een eenheid de Keep in te brengen; de verdedigers winnen als niemand daar tegen het einde van beurt 8 in slaagt.' : 'Each game turn runs through these phases. You win by moving any unit into the Keep; the defenders win if nobody gets there by the end of turn 8.'}</p>
    <ol style="margin:0;padding-left:20px;line-height:1.5">${phases.map(p => `<li><b>${p[0]}</b> — ${esc(p[1])}</li>`).join('')}</ol>
    ${house.length ? `<div class="label">${nl ? 'Huisregels in dit spel' : 'House rules in this game'}</div>${house.map(k => `<div><b>${esc(HOUSE_RULES[k].name)}</b> <span class="muted">— ${esc(tr(HOUSE_RULES[k].tip))}</span></div>`).join('')}` : ''}
    <div class="label">${nl ? 'Woordenlijst' : 'Glossary'}</div>
    <dl class="glossary">${GLOSSARY.map(g => `<dt>${esc(g[0])}</dt><dd>${esc(tr(g[1]))}</dd>`).join('')}${Object.values(TRAITS).map(t => `<dt>${esc(t.name)}</dt><dd>${esc(tr(t.tip))}</dd>`).join('')}</dl>
    <div class="label">${nl ? 'Legers' : 'Armies'}</div>
    ${ARMY_ORDER.map(a => `<div><b style="color:${ARMIES[a].color}">${ARMIES[a].name}</b> <span class="muted">— ${esc(tr(ARMIES[a].blurb))}</span></div>`).join('')}
    <p class="muted" style="font-size:13px">${nl ? 'Tip: houd een eenheid, kaart, muur of knop ingedrukt om te zien wat ze doet.' : 'Tip: press and hold any unit, card, wall or button to see what it does.'}</p>
    <button class="btn block" id="cl">${nl ? 'Sluiten' : 'Close'}</button>`, { dismiss: true });
  sh.el.querySelector('#cl').onclick = sh.close;
}
function showAbout() {
  const nl = LANG.cur === 'nl';
  const sh = sheet(`<h2>${nl ? 'Over deze app' : 'About'}</h2>
    <p style="margin:0;line-height:1.45">${nl ? 'Keepbreaker is een privé-app voor persoonlijk gebruik: speel een bordspel-belegering op een telefoon of tablet, solo tegen AI-legers of met meerdere spelers op één toestel.' : 'Keepbreaker is a private app for personal use: play a board-game siege on a phone or tablet, solo against AI armies or with several players sharing one device.'}</p>
    <p style="margin:0;line-height:1.45" class="muted">${nl ? 'Kaartteksten zijn in eigen woorden samengevat. De vormgeving is eigen aan deze app; je kunt ze vervangen door je eigen tekeningen. Siege is een label waar kaarten naar verwijzen.' : 'Card texts are summarised in our own words. The look is original to this app, and you can replace it with your own artwork. Siege is a label that cards refer to.'}</p>
    <p style="margin:0;line-height:1.45" class="muted">${nl ? 'Vereenvoudigingen: Counterspell kan een kaart die al in het spel blijft niet meer annuleren; enkele "op elk moment"-kaarten (Sabotage!, Slow, Arcane Illusions) speel je in je eigen beurt of wanneer je eenheid aangevallen wordt.' : 'Simplifications: Counterspell can\'t cancel a Remain-in-Play card after it\'s in play; a few "any time" cards (Sabotage!, Slow, Arcane Illusions) are played on your own turn or when your unit is attacked.'}</p>
    <button class="btn block" id="cl">${nl ? 'Sluiten' : 'Close'}</button>`, { dismiss: true });
  sh.el.querySelector('#cl').onclick = sh.close;
}

// ---------- boot ----------
function boot() {
  UI = UIHOOKS;
  setLang(PREF.lang || 'en');
  document.body.classList.toggle('hints-off', !PREF.hints);
  $('#board').addEventListener('click', boardTap);
  $('#menuBtn').onclick = showMenu;
  $('#helpBtn').onclick = showRules;
  renderSetup();
  loadArt();
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: S && !S.over ? snapshot() : null }));
}
function start(data) {
  boot();
  if (data && data.save) { try { const sv = JSON.parse(data.save); if (sv && !sv.over) resumeGame(sv); } catch (e) { } }
}
window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>

<script>
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} });
}
</script>
