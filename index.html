<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keepbreaker">
<meta name="theme-color" content="#12151c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Keepbreaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&family=Pirata+One&display=swap">
<style>
/* Layout: one-screen siege table — board on top, a working "war table" panel below. Single committed night-siege look. */
:root {
  --ink: #12151c;        /* night sky / page */
  --slate: #1c212c;      /* panels */
  --slate-2: #262d3b;    /* raised */
  --stone: #4a5263;      /* castle stone */
  --stone-hi: #6e7790;
  --sand: #3b3424;       /* battlefield earth */
  --sand-hi: #4c4330;
  --fg: #e9e4d6;         /* parchment text */
  --muted: #9aa0ae;
  --ember: #f0a63a;      /* torchlight accent */
  --ember-dim: #9b6420;
  --blood: #e0564a;
  --ok: #67c27a;
  --def: #7ea6ff;        /* defenders */
  --line: rgba(233, 228, 214, .12);
  --f-display: 'Pirata One', 'Times New Roman', serif;
  --f-body: 'Alegreya Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
body { margin: 0; }
#app { height: 100%; max-width: 640px; margin: 0 auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--slate-2); cursor: pointer; text-align: left; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--ember); color: #1d1406; border-color: var(--ember); font-weight: 700; }
.btn.danger { border-color: var(--blood); color: var(--blood); background: transparent; }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: 14px; }
.btn.block { width: 100%; }
.act { display: flex; flex-direction: column; align-items: flex-start; min-height: 48px; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--slate-2); cursor: pointer; text-align: left; }
.act b { font-weight: 700; font-size: 15px; }
.act small { color: var(--muted); font-size: 12.5px; line-height: 1.25; }
.act.hot { border-color: var(--ember); }
.act:disabled { opacity: .4; }
.hints-off .act small, .hints-off .guide { display: none; }

/* ---------- setup ---------- */
#setup { padding: 16px; padding-block: 18px 32px; display: flex; flex-direction: column; gap: 18px; }
.masthead { display: grid; gap: 4px; padding-block: 8px 2px; }
.masthead h1 { font-size: 52px; line-height: .9; color: var(--ember); }
.masthead p { margin: 0; color: var(--muted); max-width: 46ch; line-height: 1.4; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.army-row { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 12px; border-radius: 12px; background: var(--slate); border-left: 4px solid var(--army, var(--stone)); }
.army-row .em { font-size: 28px; line-height: 44px; text-align: center; }
.army-row h3 { font-size: 22px; }
.army-row p { margin: 2px 0 8px; font-size: 13px; color: var(--muted); line-height: 1.35; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(54px, 1fr)); gap: 4px; }
.seg button { min-height: 38px; padding: 4px 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--slate-2); font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); font-weight: 700; }
.seg button.human[aria-pressed="true"] { background: var(--army, var(--ember)); color: #111; border-color: transparent; }
.name-in { margin-top: 8px; width: 100%; min-height: 38px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--ink); color: var(--fg); font: inherit; }
.opt-block { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--slate); }
.opt-block .desc { font-size: 13px; color: var(--muted); line-height: 1.35; }
.setup-actions { display: grid; gap: 10px; }

/* ---------- game ---------- */
#game { height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
.topbar h2 { font-size: 22px; color: var(--ember); }
.topbar .phase { font-size: 13px; color: var(--muted); }
.topbar .sp { flex: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--slate); font-size: 18px; cursor: pointer; }
.players { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 0 8px 6px; }
.pchip { position: relative; padding: 4px 6px; border-radius: 8px; background: var(--slate); border-top: 3px solid var(--army); font-size: 12px; line-height: 1.25; min-width: 0; }
.pchip.off { opacity: .25; }
.pchip.cur { background: var(--slate-2); box-shadow: 0 0 0 1px var(--army); }
.pchip .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pchip .tag { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pchip .num { white-space: nowrap; overflow: hidden; }
.pchip .crown { position: absolute; right: 4px; top: 2px; }
.boardwrap { position: relative; padding: 0 6px; }
#board { display: block; width: 100%; height: auto; max-height: 56vh; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.events { display: flex; gap: 4px; padding: 6px 10px; overflow-x: auto; align-items: center; min-height: 34px; }
.evt { flex: none; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--slate-2); border: 1px solid var(--line); }
.evt.done { opacity: .45; text-decoration: line-through; }
.evt.next { border-color: var(--ember); }
.panel { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px; padding-block: 4px 18px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); background: var(--slate); }
.guide { font-size: 14px; line-height: 1.4; color: var(--fg); padding: 8px 10px; border-radius: 8px; background: rgba(240, 166, 58, .1); border-left: 3px solid var(--ember); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.stat-line { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink); font-size: 12.5px; white-space: nowrap; cursor: help; }
.chip.trait { border-color: rgba(240, 166, 58, .5); }
.ucard { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; padding: 8px; border-radius: 10px; background: var(--slate-2); }
.ucard .g { font-size: 30px; text-align: center; line-height: 44px; border-radius: 50%; background: var(--army, var(--stone)); }
.ucard h3 { font-family: var(--f-body); font-weight: 700; font-size: 16px; }
.ucard .sub { font-size: 12.5px; color: var(--muted); }
.hand { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.card { flex: none; width: 112px; min-height: 84px; padding: 6px 8px; border-radius: 9px; background: var(--ink); border: 1px solid var(--line); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.card.boss { border-color: var(--ember); }
.card.sel { box-shadow: 0 0 0 2px var(--ember); }
.card.exh { opacity: .4; }
.card .t { font-weight: 700; font-size: 13.5px; line-height: 1.15; }
.card .c { font-size: 12px; color: var(--ember); }
.card .ty { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.logline { font-size: 13px; line-height: 1.35; color: var(--muted); }
.logline.big { color: var(--ember); font-weight: 700; }
.logline.event { color: var(--fg); }
.logline.kill { color: var(--blood); }
.thinking { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--army, var(--ember)); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .3 } to { opacity: 1 } }

/* ---------- svg board ---------- */
.tok { transition: transform .35s ease; }
.tok text { pointer-events: none; }
.hl-move { fill: rgba(103, 194, 122, .28); stroke: var(--ok); stroke-width: 2; }
.hl-tgt { fill: none; stroke: var(--blood); stroke-width: 3; stroke-dasharray: 5 3; animation: dash 1s linear infinite; }
.hl-spot { fill: rgba(240, 166, 58, .25); stroke: var(--ember); stroke-width: 2; }
@keyframes dash { to { stroke-dashoffset: -16 } }
@media (prefers-reduced-motion: reduce) { .tok { transition: none } .hl-tgt, .dot { animation: none } }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5, 7, 10, .62); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88%; overflow-y: auto; background: var(--slate); border-radius: 16px 16px 0 0; padding: 16px; padding-block: 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; border-top: 2px solid var(--ember-dim); }
.sheet h2 { font-size: 30px; color: var(--ember); }
.sheet .sticky-foot { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: var(--slate); padding-block: 10px 4px; display: grid; gap: 8px; }
.buyrow { display: grid; grid-template-columns: 38px 1fr auto; gap: 8px; align-items: center; padding: 8px; border-radius: 10px; background: var(--slate-2); }
.buyrow .g { font-size: 26px; text-align: center; }
.buyrow .nm { font-weight: 700; }
.buyrow .info { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--ink); font-size: 20px; cursor: pointer; }
.stepper .n { min-width: 18px; text-align: center; font-weight: 700; }
.handoff { position: fixed; inset: 0; z-index: 60; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
.handoff .big { font-family: var(--f-display); font-size: 46px; color: var(--army, var(--ember)); line-height: 1; }
.banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 30; min-width: 70%; max-width: 92%; padding: 12px 16px; border-radius: 12px; background: rgba(18, 21, 28, .94); border: 1px solid var(--ember-dim); text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
.banner h3 { font-size: 28px; color: var(--ember); }
.banner.event h3 { color: var(--def); }
.banner p { margin: 4px 0 0; font-size: 14px; color: var(--fg); }
.battle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 31; width: min(94%, 420px); padding: 12px; border-radius: 14px; background: rgba(18, 21, 28, .96); border: 1px solid var(--line); box-shadow: 0 12px 34px rgba(0, 0, 0, .55); display: grid; gap: 8px; }
.battle .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; text-align: center; }
.battle .side { font-size: 13px; line-height: 1.2; }
.battle .side .g { font-size: 30px; }
.battle .x { font-family: var(--f-display); color: var(--ember); font-size: 22px; }
.dice { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; font-size: 13px; }
.die { width: 24px; height: 24px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 14px; background: #f4efe2; color: #222; }
.die.burst { background: #b9332a; color: #fff; }
.die.miss { opacity: .45; }
.die.def { background: #3c5fae; color: #fff; }
.battle .res { font-size: 14px; text-align: center; }
.tipb { position: fixed; z-index: 80; max-width: min(300px, 86vw); padding: 9px 11px; border-radius: 10px; background: #f4efe2; color: #1b1b1b; font-size: 13.5px; line-height: 1.35; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); pointer-events: none; }
.tipb b { display: block; margin-bottom: 2px; }
.odds { padding: 8px 10px; border-radius: 10px; background: var(--ink); border: 1px solid var(--blood); display: grid; gap: 6px; font-size: 14px; }
.glossary dt { font-weight: 700; margin-top: 8px; }
.glossary dd { margin: 2px 0 0; color: var(--muted); line-height: 1.4; }
.scores { width: 100%; border-collapse: collapse; }
.scores td { padding: 6px 4px; border-bottom: 1px solid var(--line); }


/* ---------- v3 additions ---------- */
.toast { position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 90; max-width: min(420px, 92vw); padding: 10px 14px; border-radius: 12px; background: var(--fg); color: var(--ink); font-size: 14px; line-height: 1.35; box-shadow: 0 10px 28px rgba(0, 0, 0, .5); pointer-events: none; }
.evt.flag { border-color: var(--def); background: rgba(126, 166, 255, .14); cursor: help; }
.recap { display: grid; gap: 3px; max-height: 46vh; overflow-y: auto; padding: 8px 10px; border-radius: 10px; background: var(--ink); border: 1px solid var(--line); }
.card.ready { border-color: var(--ok); }
.card.ready .ty::after { content: ' · ready'; color: var(--ok); }

/* iPad / wide landscape: board left, controls right */
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  #app { max-width: none; }
  #setup { max-width: 720px; margin: 0 auto; }
  #game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 400px); grid-template-rows: auto auto auto minmax(0, 1fr);
    grid-template-areas: "board top" "board players" "board events" "board panel"; height: 100%; }
  .topbar { grid-area: top; }
  .players { grid-area: players; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .events { grid-area: events; flex-wrap: wrap; }
  .panel { grid-area: panel; border-top: none; border-left: 1px solid var(--line); }
  .boardwrap { grid-area: board; display: flex; align-items: center; justify-content: center; padding: 8px; min-height: 0; height: 100%; }
  #board { max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); width: auto; height: 100%; max-width: 100%; aspect-ratio: 1 / 1; }
  .scrim { align-items: center; }
  .sheet { border-radius: 16px; max-height: 84%; border-top: none; border: 1px solid var(--ember-dim); }
}
.logline.card { display: block; width: auto; min-height: 0; padding: 0; border: none; border-radius: 0; background: none; cursor: auto; color: var(--ember); flex: initial; }
/* own artwork */
img.art { display: block; width: 40px; height: 40px; margin: 0 auto; object-fit: cover; border-radius: 50%; }
.art-square img.art { border-radius: 18%; }
.art-none img.art { border-radius: 0; object-fit: contain; }
.ucard .g:has(img.art) { background: none; }
.ucard .g img.art { width: 44px; height: 44px; }
.buyrow .g img.art { width: 36px; height: 36px; }
.army-row .em img.art { width: 44px; height: 44px; }
.castle-bar { font-size: 13px; font-weight: 700; color: var(--def); letter-spacing: .02em; }
details.house summary { cursor: pointer; list-style: none; }
details.house summary::-webkit-details-marker { display: none; }
details.house summary::before { content: '▸ '; }
details.house[open] summary::before { content: '▾ '; }
.hr-row input { margin-top: 4px; width: 20px; height: 20px; flex: none; }
.hr-row span { font-size: 14px; line-height: 1.35; }
.lang-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.tut-btn { border-color: var(--ember-dim); justify-content: flex-start; flex-wrap: wrap; }
.coach h2 { margin-top: 2px; }
.coach-body { line-height: 1.5; font-size: 15px; }
.coach-sheet { border-top-color: var(--ember); }
.scores.rec td { font-size: 13.5px; padding: 6px 3px; }

/* ---------- card faces ---------- */
.cardbtn { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; flex: none; text-align: left; border-radius: 11px; }
.cface { display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; border: 2px solid var(--cc); color: var(--fg);
  background: linear-gradient(180deg, var(--cd) 0%, #161a22 75%);
  background: linear-gradient(180deg, color-mix(in srgb, var(--cd) 70%, #12151c) 0%, #161a22 70%); box-shadow: 0 4px 12px rgba(0, 0, 0, .35); transition: transform .15s ease, box-shadow .15s ease; }
.cf-s { width: 104px; height: 150px; }
.cf-m { width: 150px; min-height: 216px; }
.cf-l { width: 260px; flex: none; }
.cf-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; padding: 5px 6px 4px; min-height: 36px; }
.cf-name { font-family: var(--f-display); font-size: 15px; line-height: 1.05; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cf-l .cf-name { font-size: 22px; }
.cf-cost { display: flex; gap: 2px; flex: none; }
.cb { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cb.gold { background: #e2b33c; color: #2a1c00; }
.cb.magic { background: #8b5cf6; color: #fff; }
.cb.free { background: rgba(233, 228, 214, .14); color: var(--muted); font-weight: 400; font-size: 11px; }
.cf-l .cb { min-width: 26px; height: 26px; font-size: 14px; }
.cf-art { aspect-ratio: 16 / 10; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 45%, var(--cc) 20%, var(--cd) 95%); background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--cc) 75%, #fff) 0%, var(--cc) 30%, var(--cd) 95%); border-top: 1px solid rgba(0, 0, 0, .35); border-bottom: 1px solid rgba(0, 0, 0, .35); }
.cf-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cf-art .emb { font-size: 34px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .45)); }
.cf-m .cf-art .emb { font-size: 44px; }
.cf-l .cf-art .emb { font-size: 72px; }
.cf-type { display: flex; justify-content: space-between; gap: 4px; padding: 4px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cf-l .cf-type { font-size: 11.5px; padding: 6px 10px; }
.cf-flag { color: var(--muted); }
.cf-flag.ok { color: var(--ok); }
.cf-when { margin: 0 10px; align-self: flex-start; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: rgba(233, 228, 214, .1); }
.cf-text { padding: 6px 8px 8px; font-size: 12px; line-height: 1.32; }
.cf-m .cf-text { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.cf-l .cf-text { font-size: 14.5px; line-height: 1.4; padding: 8px 10px 6px; }
.cf-army { margin-top: auto; padding: 6px 10px 8px; font-size: 11px; color: var(--muted); border-top: 1px solid rgba(233, 228, 214, .08); }
.cface.exh { opacity: .55; transform: rotate(-3deg); }
.cface { position: relative; }
.cface.ready { box-shadow: 0 0 12px 1px rgba(103, 194, 122, .55), 0 4px 12px rgba(0, 0, 0, .35); }
.cface.ready::after { content: '▶'; position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%); font-size: 9px; line-height: 14px; padding: 0 8px; border-radius: 8px 8px 0 0; background: var(--ok); color: #0d1a10; }
.cf-l.ready::after, .cf-m.ready::after { display: none; }
.cface.sel { transform: translateY(-6px); box-shadow: 0 0 0 3px #fff, 0 8px 18px rgba(0, 0, 0, .45); }
.cface.boss { border-style: double; border-width: 3px; }
.hand { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 6px; scroll-snap-type: x proximity; }
.hand .cardbtn { scroll-snap-align: start; }
.card-view { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.cv-side { display: grid; gap: 8px; flex: 1; min-width: 130px; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; justify-items: center; }
.cthumb { display: grid; place-items: center; width: 36px; height: 50px; border-radius: 5px; border: 1.5px solid var(--cc); overflow: hidden; font-size: 20px; background: radial-gradient(circle, var(--cc) 0%, var(--cd) 100%); }
.cthumb img { width: 100%; height: 100%; object-fit: cover; }

// 13x13 grid. Castle occupies rows/cols 3..9. Battlefields: N rows 0-2, E cols 10-12, S rows 10-12, W cols 0-2.

const SIDES = ['N', 'E', 'S', 'W'];

function bfCell(s, p, d) {
  if (s === 0) return [d, 5 + p];

// opts: {multi, atkBonus, atkOverride, spell:{range,name}, magicFear, mods:{A,D}, noWindows}
async function battle(att, tgt, opts) {
  opts = opts || {};
  const multi = !!opts.multi;
  if (isPlayer(att.owner) && tgt.owner === 'D' && tgt.node === KEEP) await maybeSummonHero('keepAttack');
  if (!S.units[att.id] || !S.units[tgt.id]) return null;
  if (tgt.skelSaved && tgt.flipped) {

    killUnit(tgt, att, true);

  }
  // a rival's attack can be cancelled with Frenemies
  if (isPlayer(att.owner) && isPlayer(tgt.owner) && att.owner !== tgt.owner && !opts.noWindows) {
    const r = await offerReaction(tgt.owner, 'defend', { att, tgt, frenemiesOnly: true });
    if (r && r.key === 'frenemies') {
      att.attacked = true; att.done = true; att.noAttack = true;

  }
  const mode = opts.spell ? 'ranged' : multi ? 'melee' : attackMode(att, tgt);
  const defInit = att.owner === 'D' && NODES[att.node].kind === 'kg' && S.walls[att.node] && S.walls[att.node].alive;
  const M = { A: {}, D: {} };
  if (opts.preMods && opts.preMods.tiki) M.A.tiki = true;
  // reaction windows: attacker first, then defender
  if (!opts.noWindows) {
    if (isPlayer(att.owner)) await battleWindow(att.owner, 'attack', { att, tgt, mode, multi, M, side: 'A' });
    if (isPlayer(tgt.owner) && S.units[tgt.id] && S.units[att.id]) await battleWindow(tgt.owner, 'defend', { att, tgt, mode, multi, M, side: 'D' });
  }
  if (!S.units[att.id] || !S.units[tgt.id]) return null;
  const A = battleSide(att, tgt, mode, true, multi, defInit);
  if (A.hailUsed && HR('hailLimit') && isPlayer(att.owner) && typeof S.ps[att.owner].buffs.hail === 'number') { S.ps[att.owner].buffs.hail--; log(`Hail of Arrows: ${S.ps[att.owner].buffs.hail} volley${S.ps[att.owner].buffs.hail === 1 ? '' : 's'} left.`, 'card'); }
  const D = battleSide(tgt, att, mode, false, multi, false);
  if (opts.spell) { D.canCounter = D.canCounter && (stats(tgt).range ? sightDist(tgt.node, att.node, false) <= stats(tgt).range : meleeAdjacent(tgt, att.node)); A.ranged = true; }
  if (opts.atkOverride) A.atk = opts.atkOverride + (opts.keepBuffs ? (att.buffAtk || 0) : 0);
  if (opts.atkBonus) A.atk += opts.atkBonus;
  if (opts.dmgPlus) A.dmgPlus += opts.dmgPlus;
  if (opts.rerollMiss) A.rerollMiss = true;
  if (opts.reroll1) A.reroll1 += opts.reroll1;
  if (!multi && !opts.spell && lobPenalty(att, tgt.node)) A.atk = Math.max(1, A.atk - 1);
  if (opts.magicFear) A.fear += opts.magicFear;
  if (opts.deployBonus) A.atk += opts.deployBonus;
  // card / ability modifiers
  for (const side of ['A', 'D']) {
    const X = side === 'A' ? A : D, m = M[side];
    if (m.atk) X.atk += m.atk; if (m.armor) X.armor += m.armor; if (m.dmgPlus) X.dmgPlus += m.dmgPlus;
    if (m.save) X.save += m.save; if (m.reroll1) X.reroll1 += m.reroll1; if (m.fear) X.fear += m.fear;

    attGlyph: def(att).glyph, tgtGlyph: def(tgt).glyph, A, D, mode, multi, pre: [] };
  // Sinister Strike: Attack 1 ignoring armor, no counter
  if (M.A.sinister) {
    const r = await DICE.attack(1, D.flipped ? 1 : 0, {}, `Sinister Strike: ${uname(att)}`, owners);
    const dmg = r.hits;
    rep.pre.push({ label: 'Sinister Strike', roll: r, dmg });
    D.hp -= dmg; tgt.dmg += dmg;

      log(`A Sinister Strike from ${uname(att)} kills ${uname(tgt)} before the fight starts!`, 'kill');

    const dice = await DICE.defense(sips, `Pirate Ale: ${uname(u)}`, owners); const hits = dice.filter(Boolean).length, miss = sips - hits;
    if (side === 'A') X.atk += hits; else X.armor += hits;

    let msg = `${uname(u)} guzzles ${sips} sip${sips > 1 ? 's' : ''} of Pirate Ale: +${hits} ${side === 'A' ? 'Attack' : 'Armor'}.`;
    if (miss >= 2) { X.flipped = true; u.flipped = true; msg += ' Too much! It flips — talk like a pirate, arr!'; if (UI && UI.pirate) await UI.pirate(realOwner(u)); }

    log(msg, 'card');
  }
  // Fear is rolled here (not inside fight) so The Smell of Fear can follow it
  const fearRoll = async (X, Y, xu, yu, who) => {

  if (D.flipped) { D.canCounter = false; D.armor = 0; D.cover = 0; }

  if (opts.spell && opts.spell.daze) {
    const r = await DICE.attack(A.atk, D.flipped ? 1 : 0, { rerollMiss: A.rerollMiss }, `Daze: ${uname(att)}`, owners);
    const hit = r.hits > 0 && !has(tgt, 'large') && !has(tgt, 'siege');
    if (hit) tgt.flipped = true;
    rep.res = { aDmg: 0, dDmg: 0, aDead: false, dDead: false, steps: [{ kind: 'roll', who: 'A', round: 1, roll: r, defDice: [], dmg: 0 }] };
    rep.note = hit ? `${uname(tgt)} is dazed and flips.` : 'The daze fails.';
    log(`Daze on ${uname(tgt)}: ${hit ? 'flipped!' : 'no effect.'}`, 'def');
    if (UI && UI.showBattle) await UI.showBattle(rep);
    return { rep, killed: false, died: false };
  }
  let res;
  if (D.hp <= 0) res = { aDmg: 0, dDmg: 0, aDead: false, dDead: true, steps: [], aFlipped: A.flipped, dFlipped: D.flipped };
  else res = await fightLive(A, D, multi, true, owners);
  rep.res = res;
  if (!multi && D.canCounter) tgt.counterKey = S.counterKey;
  if (att.owner === S.bossSeat && isPlayer(tgt.owner)) S.bossAttacked[tgt.owner] = true;
  const tgtHpBefore = D.hp, attHpBefore = A.hp;
  att.dmg += res.aDmg; tgt.dmg += res.dDmg;
  if (res.aFlipped) att.flipped = true;
  if (res.dFlipped) tgt.flipped = true;
  log(`${uname(att)} ${opts.spell ? 'casts ' + opts.spell.name + ' at' : mode === 'ranged' ? 'shoots' : 'attacks'} ${uname(tgt)}${multi ? ' (fight to the death)' : ''}: deals ${res.dDmg}${D.canCounter || multi ? `, takes ${res.aDmg}` : ''}.`, att.owner === 'D' ? 'def' : 'atk');
  if (UI && UI.showBattle) await UI.showBattle(rep);
  // Witchling: magic from damage dealt
  for (const [x, dealt, cap] of [[att, res.dDmg, tgtHpBefore], [tgt, res.aDmg, attHpBefore]]) {
    if (x.army === 'arcanist' && x.type === 'witch' && dealt > 0 && isPlayer(x.owner)) gainMagic(x.owner, Math.min(dealt, Math.max(0, cap)));
  }

  if (res.dDead || tgt.dmg >= stats(tgt).hp) await afterDeath(tgt, att);
  if (res.aDead) await afterDeath(att, tgt);
  if (M.A.tiki && S.units[att.id]) { att.dmg++; log(`${uname(att)} pays the Tiki price: 1 damage.`); if (att.dmg >= stats(att).hp) await afterDeath(att, null); }
  if (!opts.noWindows) await afterBattleWindows(att, tgt, { killed: !S.units[tgt.id] || tgt.dmg >= stats(tgt).hp, dealt: res.dDmg, mode, tgtNode, multi });

}
// A card-driven attack roll outside battle (events, spells): armor applies unless pierce
async function rollAgainst(u, atk, label, o) {
  o = o || {};
  if (!S.units[u.id]) return 0;
  const st = stats(u);
  const owners = [realOwner(u), 'D'];
  const roll = await DICE.attack(atk, u.flipped ? 1 : 0, { rerollMiss: o.rerollMiss }, `${label} → ${uname(u)}`, owners);
  const defd = o.pierce ? [] : await DICE.defense(u.flipped ? 0 : st.armor + (o.cover || 0), `Armor: ${uname(u)}`, owners);
  let dmg = Math.max(0, roll.hits - defd.filter(Boolean).length);
  if (roll.hits > 0 && o.dmgPlus) dmg += o.dmgPlus;
  u.dmg += dmg;
  log(`${label}: Attack ${atk} on ${uname(u)} — ${dmg} damage.`, u.owner === 'D' ? 'atk' : 'def');
  if (UI && UI.showBattle) await UI.showBattle({ kind: 'roll', attName: label, attGlyph: o.glyph || '🎲', tgtName: uname(u), tgtGlyph: def(u).glyph, tgtOwner: u.owner, roll, defDice: defd, dmg });

}
// Damage that can't be cancelled
async function directDamage(u, n, label, killer) {

  log(`${label}: ${uname(u)} takes ${n} damage.`, u.owner === 'D' ? 'atk' : 'def');

}
function gainMagic(s, n) { if (isPlayer(s) && n > 0) S.ps[s].magic = Math.min(10, S.ps[s].magic + n); }
function gainGold(s, n) { if (isPlayer(s) && n > 0) S.ps[s].gold = Math.min(10, S.ps[s].gold + n); }

// ---------- structures ----------
async function attackStructure(att, kind, node, o) {

  let dmg = roll.hits + (roll.hits > 0 ? dmgPlus : 0);
  const target = kind === 'wall' ? S.walls[node] : S.buildings[node];
  if (!target) return;
  target.dmg += dmg;
  const hp = kind === 'wall' ? target.hp : 2;
  const nm = kind === 'wall' ? (NODES[node].kind === 'kg' ? 'Keep wall' : 'castle wall') : EVENTS[target.type].name;
  const label = o.label || (att ? uname(att) : 'Attack');
  log(`${label} hits the ${nm}: ${dmg} damage${target.dmg >= hp ? ' — destroyed!' : ` (${hp - target.dmg} left)`}.`, 'atk');
  if (UI && UI.showBattle) await UI.showBattle({ kind: 'struct', attName: label, attGlyph: att ? def(att).glyph : '💣', attOwner: att ? att.owner : null, tgtName: nm, roll, hp, dmg: target.dmg, dealt: dmg });
  if (target.dmg >= hp) {
    if (kind === 'wall') await destroyWall(node, att ? realOwner(att) : (o.seat !== undefined ? o.seat : null));
    else { delete S.buildings[node]; log(`The ${nm} is destroyed.`, 'big'); }
  }

async function destroyWall(w, seat) {
  S.walls[w].alive = false; S.walls[w].owner = seat;

  if (NODES[w].kind === 'ramp') {

// ---------- deaths ----------

function wantsSkelSave(s) {

// Remove a unit, with every on-death ability. killer may be null.
async function afterDeath(u, killer, noSave) {
  if (!S.units[u.id]) return;
  const owner = realOwner(u);
  if (!noSave && isPlayer(owner) && u.army === 'undead' && u.type === 'skel' && !u.skelSaved && S.ps[owner].magic >= skelSaveCost()
      && unitsAt(u.node).length === 1 && NODES[u.node].kind !== 'loc' && wantsSkelSave(owner)) {

    log(`${uname(u)} collapses into a heap of bones (${skelSaveCost()} magic) — it can rise again.`, 'card');

    const extra = isHuman(owner) && UI.graveyard ? await UI.graveyard(owner, u, killer) : AI.graveyard(owner, u, killer);
    if (extra) {
      S.ps[owner].magic -= extra.spend;
      log(`The Grim Graveyard lashes out at ${uname(killer)}!`, 'card');
      await rollAgainst(killer, 1 + Math.floor(extra.spend / 3), 'Grim Graveyard');
      if (!S.units[killer.id] && !unitsAt(node).length) {

        nu.dmg = full ? 0 : stats(nu).hp - 1; nu.done = true; nu.attacked = true;

function killUnit(u, killer) {
  if (!S.units[u.id]) return;

  if (killer && isPlayer(killer.owner) && S.units[killer.id] && fumeInPlay(killer.owner) && has(killer, 'undead') && !(u.army === 'undead')) gainMagic(killer.owner, 1);

// ---------- hero ----------
async function maybeSummonHero(reason) {

  else if (grounds.some(empty)) spot = grounds.find(empty);

  log(`A HERO APPEARS! ${HEROES[type].name} rushes to defend the castle.`, 'big');

    const ch = bldg('church');

  }
  if (UI && UI.banner) await UI.banner('A Hero appears!', `${HEROES[type].glyph} ${HEROES[type].name} joins the defenders`);
  await DEF.onwardMarch(1, true);
  S.heroExtraEvent++;
}

// ---------- unit actions (dark forces) ----------
function selectUnitCheck(u) {

        if (takeMagic) gainMagic(S.bossSeat, 1); else if (ps.gold < 10) gainGold(S.bossSeat, 1); else gainMagic(S.bossSeat, 1);
      }
      S.phase = 'buy'; S.curIdx = 0; S.bought = {}; for (const s of S.players) S.ps[s].gravers = false; saveGame();
    }
    if (S.phase === 'buy') {
      UI.render();
      while (S.curIdx < S.order.length) {
        const s = S.order[S.curIdx]; S.cur = s;
        if (isHuman(s)) { if (multiHuman()) await UI.handoff(s, 'Buy phase'); await UI.buy(s); }
        else { AI.buy(s); await sleep(200); }
        S.curIdx++;
      }
      S.phase = 'deploy'; S.curIdx = 0; S.tf.banned = S.tf.banned || {}; saveGame();
    }
    if (S.phase === 'deploy') {
      while (S.curIdx < S.order.length) {
        if (S.over) return;
        const s = S.order[S.curIdx]; S.cur = s;
        if (S.bought[s] && S.bought[s].length) {
          if (isHuman(s)) { if (multiHuman()) await UI.handoff(s, 'Deploy your troops'); await UI.deploy(s); }
          else await AI.deploy(s);
        }
        if (S.bought[s]) for (const b of S.bought[s]) { if (b.kind === 'equip') S.ps[s].discard.push(b.card); if (b.kind === 'unit' && b.card) S.ps[s].hand.push(b.card); }
        S.bought[s] = [];
        S.curIdx++;
      }
      S.phase = 'reinforce'; saveGame();
    }
    if (S.phase === 'reinforce') {
      S.cur = null;
      const n = Math.max(0, ((S.turn === 4 || S.turn === 7) ? 2 : 1) - (HR('thinGarrison') && S.turn === 1 ? 1 : 0));
      log('Reinforcements arrive at the castle.', 'phase');
      await DEF.reinforce(n);
      const nEv = countEvents();
      S.stack = []; for (let i = 0; i < nEv; i++) S.stack.push({ key: drawEvent(), done: false });
      S.stackPos = 0; S.omHighest = null;
      S.slots = eventSlotsFor(nEv);
      log(`The defenders will face you with ${nEv} Event cards this turn.`, 'phase');
      UI.render();
      if (UI.banner) await UI.banner(`${nEv} Events this turn`, 'One per castle side with a wall standing, plus one (and +1 for a Hero or the Church)', 'event');
      S.phase = 'turns'; S.curIdx = 0; S.turnStage = 'start'; S.turnsBegun = false; saveGame();
    }
    if (S.phase === 'turns') {
      if (!S.turnsBegun) {
        S.turnsBegun = true;
        // Final Push! is played before the first player's turn
        const b = S.bossSeat;
        if (b !== null && S.ps[b].bossHand.includes('push')) {
          const want = isHuman(b) ? (multiHuman() && await UI.handoff(b, 'Boss decision'), await UI.confirm(b, 'Play Final Push! — every army gets +1 Army Move this game turn?')) : AI.wantsFinalPush(b);
          if (want) { S.ps[b].bossHand.splice(S.ps[b].bossHand.indexOf('push'), 1); S.bossDiscard.push('push'); S.tf.finalPush = true; log('Final Push! Every army gets +1 Army Move this turn.', 'big'); }
        }
        builderRepair();
      }
      while (S.curIdx < S.order.length) {
        const s = S.order[S.curIdx]; S.cur = s;
        if (S.turnStage === 'start') {
          if (S.curIdx === 0 && S.heroId && S.units[S.heroId]) await DEF.onwardMarch(1, true);
          await resolveNextEvents(S.slots[s].start);
          if (S.over) return;
          resetTurnFlags(s);
          S.turnStage = 'play'; saveGame();
        }
        if (S.turnStage === 'play') {
          UI.render();
          if (isHuman(s)) { if (multiHuman()) await UI.handoff(s, 'Your turn'); await UI.turn(s); }
          else await AI.turn(s);
          if (S.over) { clearSave(); return; }
          endPayroll();
          S.turnStage = 'end';
        }
        if (S.turnStage === 'end') {
          const extra = S.heroExtraEvent; S.heroExtraEvent = 0;
          for (let i = 0; i < extra; i++) S.stack.push({ key: drawEvent(), done: false });
          await resolveNextEvents(S.slots[s].end + extra);
          if (S.over) return;
          for (const u of unitsOf(s)) u.done = true;
          S.curIdx++; S.turnStage = 'start'; saveGame();
        }
      }
      S.phase = 'wrap';
    }
    if (S.phase === 'wrap') {
      S.cur = null;
      for (const s of S.players) {
        const ps = S.ps[s];
        const lim = handLimit(s);
        if (ps.hand.length > lim && isHuman(s) && UI.discard) {
          if (multiHuman()) await UI.handoff(s, 'Discard down to your hand limit');
          await UI.discard(s, lim);
        }
        while (ps.hand.length > lim) {
          const idx = AI.discardIndex(s);
          const k = ps.hand.splice(idx, 1)[0]; const e = ps.exhausted.indexOf(k); if (e >= 0) ps.exhausted.splice(e, 1);
          ps.discard.push(k);
        }
        while (ps.bossHand.length + ps.rip.length > 3 && ps.bossHand.length) S.bossDiscard.push(ps.bossHand.shift());
      }
      for (const d of unitsOf('D')) d.flipped = false;
      const leftovers = S.stack.map(e => e.key);
      if (S.omHighest) { const i = leftovers.indexOf(S.omHighest); if (i >= 0) leftovers.splice(i, 1); S.eventDeck.push(S.omHighest); shuffle(S.eventDeck); }
      S.eventDiscard.push(...leftovers);
      S.stack = []; S.stackPos = 0; S.tf = {};
      if (S.turn >= 8) {
        S.over = true; S.winner = 'D';
        log('Turn 8 is over. The defenders hold the castle!', 'big');
        clearSave(); UI.render(); return;
      }
      S.turn++;
      S.phase = 'collect'; saveGame();
    }
  }
}

// ===== ai =====
// ===== DARK FORCE AI =====
const AI = {
  lvl(s) { return S.seats[s].ctrl; },          // 'easy' | 'normal' | 'hard'
  noise(s) { return { easy: 3.0, normal: 1.2, hard: 0.4 }[this.lvl(s)] || 0; },
  sims(s) { return { easy: 8, normal: 16, hard: 40 }[this.lvl(s)] || 16; },
  smart(s) { return this.lvl(s) !== 'easy'; },
  // the improved Hard brain (seats can be flagged 'old' by the test harness to compare)
  F: { buy: 1, loc: 1, focus: 0, push: 1, last: 1, pm: 1, phi: 0 },
  h2(s, f) { return this.lvl(s) === 'hard' && !S.seats[s].old && (!f || this.F[f]); },
  // one wall the whole army concentrates on: closest to our units, already damaged, ladders count against it
  focusWall(s) {
    const key = S.turn + ':' + WALL_NODES.filter(w => S.walls[w].alive).length + ':' + Object.keys(S.ladders).length;
    this._focus = this._focus || {};
    const c = this._focus[s];
    if (c && c.key === key && c.S === S) return c.w;
    const mine = unitsOf(s).filter(u => !has(u, 'nokeep') || has(u, 'structonly') || def(u).structAtk);
    const inside = mine.some(u => inCastle(u.node) && NODES[u.node].kind !== 'ramp');
    let best = null, bv = 1e9;
    for (const w of WALL_NODES) {
      const wl = S.walls[w]; if (!wl.alive) continue;
      const kind = NODES[w].kind;
      if (kind === 'kg' && !inside) continue;
      const front = wallFront(w);
      let d = 0;
      for (const u of mine) d += Math.min(8, this.hops(u.node, front));
      d = mine.length ? d / mine.length : (kind === 'ramp' && NODES[w].side === s ? 0 : 4);
      let v = d * 1.0 + (wl.hp - wl.dmg) * 0.9 + (kind === 'ramp' && NODES[w].side !== s ? 1.5 : 0) - (kind === 'kg' ? 1.5 : 0);
      if (v < bv) { bv = v; best = w; }
    }
    this._focus[s] = { key, w: best, S };
    return best;
  },
  // plain step count ignoring walls and units (cross-battlefield links count 2)
  hops(a, b) {
    if (a === b) return 0;
    this._hops = this._hops || {};
    let m = this._hops[a];
    if (!m) {
      m = { [a]: 0 }; const q = [a];
      while (q.length) {
        const x = q.shift();
        for (const y of NB[x]) if (m[y] === undefined) { m[y] = m[x] + 1; q.push(y); }
        for (const y of CROSS[x]) if (m[y] === undefined) { m[y] = m[x] + 2; q.push(y); }
      }
      this._hops[a] = m;
    }
    return m[b] === undefined ? 9 : m[b];
  },
  isStriker(d) { return !d.traits.includes('nokeep') && !d.traits.includes('structonly'); },

  // --- assault distance field (Dijkstra from the Keep) ---
  field(withLadder) {
    const dist = { [KEEP]: 0 };
    const pq = [[0, KEEP]];
    while (pq.length) {
      pq.sort((a, b) => a[0] - b[0]);
      const [d, a] = pq.shift();
      if (d > dist[a]) continue;
      for (const b of NB[a]) {
        let c = 1;
        const w = wallBetween(a, b);
        if (w) {
          const front = wallFront(w);
          const outer = a === w ? b : a;
          const wall = S.walls[w];
          if (outer === front && ladderAt(front)) c = 1.2;
          else if (withLadder && outer === front) c = 2.2;
          else c = 1.5 + (wall.hp - wall.dmg) * 1.1 + (outer === front ? 0 : 0.6);
        }
        const occ = unitAt(b);
        if (occ && occ.owner === 'D' && occ.type !== 'peasant') c += 1.8 + hpLeft(occ) * 0.4;
        const nd = d + c;
        if (dist[b] === undefined || nd < dist[b]) { dist[b] = nd; pq.push([nd, b]); }
      }
    }
    return dist;
  },
  distOf(u, node, F) {
    if (NODES[node].kind === 'loc') return 9;
    const f = (u.ladder || climbs(u)) ? F.l : F.n;
    let d = f[node] === undefined ? 12 : f[node];
    if (has(u, 'nokeep') || has(u, 'structonly')) d = Math.max(d, 1.5);
    return d;
  },
  unitValue(u) { const d = def(u); return (d.cost || 4) * 0.6 + 1 + (u.type === 'champ' ? 2 : 0); },
  expectedHits(n, extra) { return n > 0 ? 0.5 + (n - 1 + (extra || 0)) / 3 : 0; },

  danger(u, node) {
    if (NODES[node].kind === 'loc') return 0;
    let dng = 0;
    for (const d of unitsOf('D')) {
      if (d.type === 'peasant' || d.flipped) continue;
      const st = stats(d);
      const dd = sightDist(d.node, node, false);
      if (st.range && dd <= st.range + 1) dng += st.atk * 0.35;
      else if (inCastle(node) && sightDist(d.node, node, true) <= 3) dng += st.atk * 0.3;
    }
    return dng * (1 + (S.stack.length - S.stackPos) * 0.1) / Math.max(1, stats(u).hp - u.dmg) * this.unitValue(u) * 0.3;
  },
  simAttack(u, node, t, extraAtk, multi) {
    const save = u.node; u.node = node;
    const mode = multi ? 'melee' : attackMode(u, t);
    const A = battleSide(u, t, mode, true, !!multi, false);
    const D = battleSide(t, u, mode, false, !!multi, false);
    u.node = save;
    A.atk += extraAtk || 0;
    if (!multi && lobPenalty(u, t.node)) A.atk = Math.max(1, A.atk - 1);
    const N = this.sims(u.owner);
    let dealt = 0, kill = 0, taken = 0, die = 0;
    for (let i = 0; i < N; i++) { const r = fight(A, D, !!multi, false); dealt += Math.min(r.dDmg, D.hp); taken += Math.min(r.aDmg, A.hp); if (r.dDead) kill++; if (r.aDead) die++; }
    return { dealt: dealt / N, kill: kill / N, taken: taken / N, die: die / N, hpT: D.hp, hpA: A.hp };
  },
  targetValue(s, t) {
    if (t.owner === 'D') {
      let v = 2 + stats(t).atk * 0.8 + (isHero(t) ? 6 : 0);
      if (t.node === KEEP) v += 6;
      return v;
    }
    if (this.lvl(s) === 'easy') return -5;
    const kd = KEEP_DIST[t.node] === undefined ? 9 : KEEP_DIST[t.node];
    return kd <= 2 ? 8 : kd <= 3 ? 3 : -2;
  },
  wallValue(s, w, e) {
    const wl = S.walls[w], left = wl.hp - wl.dmg;
    const pDestroy = Math.min(1, e / left) * (left <= 1 ? 1 : left === 2 ? 0.65 : 0.4);
    let v = Math.min(e, left) * 0.9 + pDestroy * 3.2;
    if (NODES[w].kind === 'kg') v *= 1.4;
    if (ladderAt(wallFront(w))) v *= 0.7;
    if (this.h2(s, 'focus')) { const f = this.focusWall(s); v *= f === w ? 1.45 : f ? 0.6 : 1; }
    return v;
  },
  scoreAttack(u, node, tgt, extraAtk) {
    const s = u.owner;
    if (tgt.wall) {
      let n = (def(u).structAtk || stats(u).atk) + (extraAtk || 0) + (u.equip.includes('moreboom') ? 1 : 0);
      let e = this.expectedHits(n, 0);
      if (tikiReady(u) && !HR('tikiUnits')) e = e > 0 ? e + 3 * Math.min(1, e) * 0.75 : e;
      return this.wallValue(s, tgt.wall, e) - (def(u).sappa ? this.unitValue(u) * 0.3 : 0);
    }
    if (tgt.bldg) return 2 + (S.buildings[tgt.bldg] && S.buildings[tgt.bldg].type === 'church' ? 2 : 0);
    const t = S.units[tgt.unit];
    const r = this.simAttack(u, node, t, extraAtk);
    let tv = this.targetValue(s, t);
    const lvl = this.lvl(s);
    if (lvl !== 'easy' && t.owner === 'D') {
      const w = lvl === 'hard' ? 1 : 0.5;
      const locked = unitsOf(s).filter(x => x.id !== u.id && inCastle(x.node) && NB[x.node].includes(t.node)).length;
      tv += locked * 1.5 * w;
      if (t.node === KEEP) {
        const costHere = node === u.node ? 0 : (reachable(u)[node] || { cost: 0 }).cost;
        const canMarch = NODES[node].kind === 'kg' && !stats(u).range && moveBudget(u) - costHere >= 1 && S.ps[s].armyMoves - costHere >= 1 && !has(u, 'nokeep');
        const follower = unitsOf(s).some(x => x.id !== u.id && NODES[x.node].kind === 'kg' && !x.done && !x.flipped && moveBudget(x) >= 1 && !has(x, 'nokeep'));
        tv += (canMarch ? 60 : follower ? 25 : 6) * w;
      }
    }
    return r.dealt * (tv / Math.max(1, r.hpT)) * 1.2 + r.kill * tv - r.taken * this.unitValue(u) / Math.max(1, r.hpA) - r.die * this.unitValue(u) * 0.8;
  },

  // enumerate plans for one unit
  bestPlanFor(u, F) {
    const s = u.owner;
    const lvl = this.lvl(s);
    const plans = [];
    const curD = this.distOf(u, u.node, F);
    if (u.flipped) {
      if (canUnflip(u)) plans.push({ u, kind: 'unflip', score: 1.5 + (lvl === 'easy' ? RNG() : 0) });
      return plans;
    }
    if (u.done) return plans;
    const dests = { [u.node]: { cost: 0, battle: false } };
    const R = reachable(u);
    for (const k in R) dests[k] = R[k];
    for (const node in dests) {
      const info = dests[node];
      if (node === KEEP) { plans.push({ u, kind: 'move', dest: node, score: 9999 }); continue; }
      const nd = this.distOf(u, node, F);
      let base = this.h2(s, 'phi') ? (curD - nd) + 4 / (nd + 1) - 4 / (curD + 1) : (curD - nd) * 1.0;
      if (lvl !== 'easy') base -= this.danger(u, node) * (this.h2(s, 'last') && S.turn >= 8 ? 0.15 : 1);
      base -= info.cost * 0.12 + (info.magic || 0) * 0.15;
      if (NODES[node].kind === 'loc') {
        const L = LOCATIONS[NODES[node].loc].key;
        const held = unitAt(node);
        let lv = { gold: 2.6, magic: ['arcanist', 'undead'].includes(S.seats[s].army) ? 2.2 : 0.2, hand: 0.2, draw: 1.4 }[L];
        const heldLocs = LOC_NODES.filter(n => { const x = unitAt(n); return x && x.owner === s; }).length;
        if (heldLocs >= 1) lv -= 2.5;
        if (S.turn >= 6) lv *= 0.3;
        base += lv - 1.5 + (curD > 6 ? 0.5 : -2);
        if (held && held.owner === s) continue;
        if (this.h2(s, 'loc')) {
          const d = def(u);
          if (S.turn >= 5 || has(u, 'slow') || d.cost >= 3 || u.type === 'champ' || has(u, 'nokeep')) continue;
          if (heldLocs >= 1 && L !== 'gold') continue;
        }
      }
      if (info.battle) {
        const t = unitsAt(node).find(x => x.owner !== s);
        if (!t) continue;
        if (this.h2(s, 'loc') && t.type === 'peasant' && NODES[node].kind === 'loc' && (def(u).cost >= 3 || u.type === 'champ' || has(u, 'slow') || S.turn >= 5)) continue;
        const r = this.simAttack(u, u.node, t, 0, true);
        const tv = t.type === 'peasant' ? 1 : this.targetValue(s, t);
        base += r.kill * (tv + 1) - r.die * (this.unitValue(u) + Math.max(0, base));
        plans.push({ u, kind: 'move', dest: node, score: base });
        continue;
      }
      const ladderHere = u.ladder && FRONT_OF[node] && wallIntact(FRONT_OF[node]) && !ladderAt(node);
      if (ladderHere) base += lvl === 'easy' ? 1 : 2.2;
      plans.push({ u, kind: 'move', dest: node, score: base, ladder: ladderHere });
      for (const t of attackTargets(u, node)) {
        if (t.unit && S.units[t.unit].owner !== 'D' && lvl === 'easy') continue;
        plans.push({ u, kind: 'move', dest: node, target: t, score: base + this.scoreAttack(u, node, t, 0), ladder: ladderHere });
      }
    }
    if (lvl !== 'easy') {
      const sp = spinTargets(u);
      if (sp.length) plans.push({ u, kind: 'spin', score: sp.reduce((a, t) => a + (t.owner === 'D' ? 1.2 + (hpLeft(t) <= 2 ? 2.5 : 0) + (t.node === KEEP ? 10 : 0) : t.owner === s ? -this.unitValue(t) * 0.5 : this.targetValue(s, t) * 0.4), 0) * 0.7 });
      if (canRepair(u) && !attackTargets(u).length) plans.push({ u, kind: 'repair', score: 0.4 + u.dmg * 0.3 });
      if (canBootz(u) && hpLeft(u) >= 2 && (Object.keys(R).length || attackTargets(u).length)) plans.push({ u, kind: 'bootz', score: 0.9 + (inCastle(u.node) ? 0.5 : 0) });
      const fs = flipShotTargets(u);
      for (const t of fs) { const tu = S.units[t.unit]; if (tu.owner === 'D' && !meleeAdjacent(u, tu.node)) plans.push({ u, kind: 'fshot', target: t, score: AI.expectedHits(2) / Math.max(1, hpLeft(tu)) * this.targetValue(s, tu) * 0.8 - 0.5 }); }
      // Push for +1 move when Slow (e.g. to reach a Location or get through Caltrops)
      if (pushOptions(u).some(o => o.kind === 'move') && hpLeft(u) >= 2 && u.mvUsed === 0) {
        u.pushMv = (u.pushMv || 0) + 1; const R2 = reachable(u); u.pushMv--;
        let bestGain = 0, cur = 0, bestN = null;
        for (const n in R) cur = Math.max(cur, curD - this.distOf(u, n, F));
        for (const n in R2) { if (this.h2(s, 'pm') && NODES[n].kind === 'loc') continue; const g = curD - this.distOf(u, n, F) - (this.h2(s, 'pm') ? this.danger(u, n) : 0); if (g > bestGain) { bestGain = g; bestN = n; } }
        if (bestGain - cur > 1.2) plans.push({ u, kind: 'pushmove', score: bestGain - cur - 0.8, dest: this.h2(s, 'pm') ? bestN : null });
      }
    }
    return plans;
  },

  async turn(s) {
    const lvl = this.lvl(s);
    await this.playBoss(s);
    await this.playCards(s, 'start');
    let guard = 0;
    while (!S.over && guard++ < 70) {
      planStart();
      const F = { n: this.field(false), l: this.field(true) };
      let all = [];
      for (const u of unitsOf(s)) all.push(...this.bestPlanFor(u, F));
      planEnd();
      if (!all.length) break;
      const nz = this.noise(s);
      for (const p of all) p.score += nz ? (RNG() - 0.5) * nz : 0;
      all = all.filter(p => !(p.kind === 'move' && p.dest === p.u.node && !p.target && !p.ladder));
      all.sort((a, b) => b.score - a.score);
      const p = all[0];
      if (!p || p.score <= (lvl === 'easy' ? -0.5 : 0.05)) break;
      if (UI && UI.aiFocus) UI.aiFocus(p.u.id);
      await this.exec(p);
      await sleep(320);
      if (S.over) return;
      if (lvl !== 'easy' && guard % 3 === 0) await this.playCards(s, 'mid');
    }
    if (!S.over) await this.playCards(s, 'end');
    for (const u of unitsOf(s)) u.done = true;
  },
  async exec(p) {
    const u = p.u;
    if (!S.units[u.id]) return;
    if (p.kind === 'unflip') { unflip(u); return; }
    if (p.kind === 'spin') { await spinningDoom(u); return; }
    if (p.kind === 'repair') { repairUnit(u); return; }
    if (p.kind === 'bootz') { await fireBootz(u); return; }
    if (p.kind === 'pushmove') {
      await pushUnit(u, 'move');
      // the improved AI follows through with the move it pushed for
      if (p.dest && S.units[u.id] && !S.over && reachable(u)[p.dest]) await this.exec({ u, kind: 'move', dest: p.dest });
      return;
    }
    if (p.kind === 'fshot') { await flipShot(u, p.target); return; }
    if (p.dest !== u.node) {
      await moveUnit(u, p.dest);
      if (!S.units[u.id] || S.over) return;
      if (UI && UI.render) UI.render();
      await sleep(200);
    }
    if (u.node !== p.dest) return;
    if (p.ladder && canPlaceLadder(u)) placeLadder(u);
    if (p.target) {
      const tg = attackTargets(u).find(t => (t.unit && t.unit === p.target.unit) || (t.wall && t.wall === p.target.wall) || (t.bldg && t.bldg === p.target.bldg));
      if (tg) {
        const lvl = this.lvl(u.owner), ps = S.ps[u.owner];
        const vsDef = tg.unit && S.units[tg.unit].owner === 'D';
        if (lvl !== 'easy') {
          if (vsDef && pushOptions(u).some(o => o.kind === 'fear') && hpLeft(u) >= 2) await pushUnit(u, 'fear');
          if (!S.units[u.id]) return;
          if (vsDef && canEmpower(u)) await empower(u, 'atk');

  wantsBattleMarch(u, node) {

  // --- card values ---

  wantsExhaust(s, key) { return S.ps[s].hand.length < handLimit(s); },
  pickFromDeck(s) {

  defDanger(d) { return stats(d).atk + (d.node === KEEP ? 4 : 0) + Object.values(S.units).filter(u => u.owner !== 'D' && sightDist(d.node, u.node, true) <= 2).length; },

  // --- reactions ---

  // --- playing cards on the AI's turn ---
  async playBoss(s) {
    const ps = S.ps[s];

  async playCards(s, when) {

      if (lvl === 'hard') await tryPlay('ruthless', ch => { const cnt = t => mine().filter(u => u.type === t).length; const c = ch.filter(c => cnt(c.type) >= 2).sort((a, b) => cnt(b.type) - cnt(a.type)); return c.find(x => x.kind === 'atk') || null; });
      if (lvl === 'hard') await tryPlay('recall', ch => ch.find(c => CARDS[c.card].champ && !mine().some(u => u.type === 'champ')) || null);
    }

          let v = (x.owner === 'D' ? this.targetValue(s, x) : this.targetValue(s, x) * 0.5) * (kill ? 1 : 0.4) - (c.bonus ? 1 : 0);

  },

  // --- boss / order ---
  bid(s, bonus) {

  pickOrder(s, toks) { return this.lvl(s) === 'easy' ? toks[rnd(toks.length)] : Math.min(...toks); },
  keepBossCard(s, two) {

  // --- buying ---
  buy(s) {
    const ps = S.ps[s], lvl = this.lvl(s);
    const army = S.seats[s].army, U = ARMIES[army].units;
    const freeStarts = () => deploySpots(s, 'x').filter(x => x.cost === 0 && !x.replace).length - (S.bought[s] || []).filter(b => b.kind === 'unit').length;
    const champCard = ARMIES[army].champCard;
    // Champion first, then the Upgrade
    if (inHandReady(s, champCard) && tokensLeft(s, 'champ') > 0 && freeStarts() > 0 && (lvl !== 'easy' || RNG() < 0.6)) buy(s, { kind: 'champ', card: champCard });
    else if (lvl !== 'easy' && canChampCall(s) && freeStarts() > 0 && ps.gold >= 6 + (S.turn <= 1 ? 2 : 0)) buy(s, { kind: 'champcall' });
    if (lvl !== 'easy' && !ps.upgrade && S.turn <= 6) {

        const owned = x => unitsOf(s).filter(u => u.type === x).length + (S.bought[s] || []).filter(b => b.kind === 'unit' && b.type === x).length;
        const all = Object.keys(U).filter(x => x !== 'champ');
        const strikers = all.filter(x => this.isStriker(U[x])).reduce((a, x) => a + owned(x), 0) + (unitsOf(s).some(u => u.type === 'champ') ? 1 : 0);
        const breakers = all.filter(x => U[x].traits.includes('structonly') || U[x].structAtk || U[x].traits.includes('nokeep')).reduce((a, x) => a + owned(x), 0);
        const focus = this.focusWall(s);
        if (this.isStriker(d)) { v += 1.2 + d.hp * 0.5; if (strikers < 4) v *= 1.35; if (d.hp <= 1) v *= 0.8; }

  },
  async deploy(s) {

    const F = { n: this.field(false), l: this.field(true) };
    let guard = 0;
    while (S.bought[s].some(b => b.kind === 'unit') && guard++ < 20) {
      const idx = S.bought[s].findIndex(b => b.kind === 'unit');
      const b = S.bought[s][idx];
      const spots = deploySpots(s, b.type).filter(x => !x.replace && !x.battle && (x.cost === 0 || S.ps[s].gold >= x.cost));
      if (!spots.length) { if (b.card) S.ps[s].hand.push(b.card); S.ps[s].gold += b.cost; S.bought[s].splice(idx, 1); continue; }

      const score = n => -(F.n[n] || 12) + (lvl === 'easy' ? RNG() * 3 : RNG() * 0.3);

      await sleep(150);
    }
    const starters = () => unitsOf(s).filter(u => NODES[u.node].kind === 'bf' && NODES[u.node].depth === 0 && !u.ladder && has(u, 'melee') && !u.flipped && !climbs(u) && !has(u, 'noequip')).sort((a, b) => this.unitValue(a) - this.unitValue(b));
    while (S.bought[s].some(b => b.kind === 'ladder')) { const c = starters()[0]; if (!c || !giveLadder(s, c)) break; }
    for (let i = S.bought[s].length - 1; i >= 0; i--) {

      const val = u => {
        const st = stats(u);

        return st.atk + st.hp;

// English text → Dutch, built once from the data above
const NL_MAP = (() => {
  const m = {};
  const put = (en, nl) => { if (en && nl) m[en] = nl; };
  for (const k in NL_DATA.traits) put(TRAITS[k] && TRAITS[k].tip, NL_DATA.traits[k]);
  for (const k in NL_DATA.units) {
    const [a, t] = k.split('.');
    const d = a === 'D' ? (t === 'peasant' ? PEASANT : DEFENDERS[t] || HEROES[t]) : ARMIES[a].units[t];
    put(d && d.ability, NL_DATA.units[k]);
  }
  for (const a in NL_DATA.blurbs) put(ARMIES[a].blurb, NL_DATA.blurbs[a]);
  for (const L of LOCATIONS) put(L.tip, NL_DATA.locs[L.key]);
  for (const k in NL_DATA.cards) put(CARDS[k] && CARDS[k].tip, NL_DATA.cards[k]);
  for (const k in NL_DATA.equip) put(EQUIP[k] && EQUIP[k].tip, NL_DATA.equip[k]);
  for (const k in NL_DATA.boss) put(BOSS_CARDS[k] && BOSS_CARDS[k].tip, NL_DATA.boss[k]);
  for (const k in NL_DATA.events) put(EVENTS[k] && EVENTS[k].tip, NL_DATA.events[k]);
  for (const k in NL_DATA.spells) put(DEF_SPELLS[k] && DEF_SPELLS[k].tip, NL_DATA.spells[k]);
  for (const k in NL_DATA.house) put(HOUSE_RULES[k] && HOUSE_RULES[k].tip, NL_DATA.house[k]);
  for (const [term, text] of GLOSSARY) put(text, NL_DATA.glossary[term]);
  for (const k in NL_DATA.ui) put(k, NL_DATA.ui[k]);
  for (const k in NL_DATA.words) put(k, NL_DATA.words[k]);
  return m;
})();
// translate an explanation (whole text, then sentence by sentence, then patterns)
function tr(s) {
  if (LANG.cur !== 'nl' || !s || typeof s !== 'string') return s;
  if (NL_MAP[s]) return NL_MAP[s];
  for (const [re, rep] of NL_DATA.rx) if (re.test(s)) return s.replace(re, rep);
  const parts = s.split(/(?<=[.!?)])\s+/);
  if (parts.length > 1) {
    // try growing groups of sentences, so multi-sentence data texts glued to a suffix still match
    const out = [];
    for (let i = 0; i < parts.length;) {
      let hit = null, j;
      for (j = parts.length; j > i; j--) { const chunk = parts.slice(i, j).join(' '); if (NL_MAP[chunk]) { hit = NL_MAP[chunk]; break; } }
      if (hit) { out.push(hit); i = j; } else { let p = parts[i]; for (const [re, rep] of NL_DATA.rx) if (re.test(p)) p = p.replace(re, rep); out.push(p); i++; }
    }
    return out.join(' ');
  }
  return s;
}

let TUT_RUN = {};
function tutOn() { return !!(S && S.opts && S.opts.tutorial && !S.over); }
async function tut(key) {
  if (!S || !S.opts || !S.opts.tutorial || (UIX && UIX.skip)) return;
  S.tutSeen = S.tutSeen || {};
  if (S.tutSeen[key] || TUT_RUN[key] || !TUT_STEPS[key]) return;
  S.tutSeen[key] = true; TUT_RUN[key] = true;
  const [title, body] = TUT_STEPS[key][LANG.cur === 'nl' ? 'nl' : 'en'];
  const nl = LANG.cur === 'nl';
  const gen = GEN;
  await new Promise(res => {
    const sh = sheet(`<div class="coach"><div class="label">🎓 ${nl ? 'Begeleid spel' : 'Guided game'}</div><h2>${title}</h2><div class="coach-body">${body}</div></div>

}

// --- deploy (board interaction) ---
async function humanDeploy(s) {
  promptStart();
  await tut('deploy');
  const gen = GEN;
  UIX.mode = 'deploy';
  let selIdx = -1;
  return new Promise(res => {
    const done = () => { UIX.mode = 'idle'; UIX.panelFn = null; UIX.onBoard = null; clearHL(); res(); };
    const setSpots = () => {
      clearHL();
      const b = S.bought[s][selIdx];
      if (!b) return;
      if (b.kind === 'unit') UIX.spots = deploySpots(s, b.type).filter(x => x.cost <= S.ps[s].gold).map(x => x.node);
      if (b.kind === 'ladder') UIX.spots = unitsOf(s).filter(u => NODES[u.node].kind === 'bf' && NODES[u.node].depth === 0 && !u.ladder && !has(u, 'noequip')).map(u => u.node);
      if (b.kind === 'equip') UIX.spots = unitsOf(s).filter(u => canEquip(s, b, u)).map(u => u.node);
    };
    UIX.panelFn = () => {
      const items = S.bought[s] || [];
      if (selIdx >= items.length) selIdx = -1;
      const lbl = b => b.kind === 'unit' ? `${ARMIES[S.seats[s].army].units[b.type].glyph} ${ARMIES[S.seats[s].army].units[b.type].name}` : b.kind === 'ladder' ? '🪜 Ladder' : `${(EQUIP[b.equip] || {}).glyph || '⚙️'} ${CARDS[b.card].name}`;
      const cur = items[selIdx];
      let g = 'Tap something you bought, then tap a glowing space on the board.';
      if (cur && cur.kind === 'unit') g = `Tap a glowing space. ${S.ps[s].gravers ? 'Summon the Gravers: rival start spaces are free and deploy battles get +1 attack.' : 'Rival start spaces cost +1 gold;'} if a rival unit stands there, you fight it to the death. Tapping your own unit sacrifices it to make room.${S.ps[s].upgrade === 'portals' ? ' Portals let you deploy one space further forward.' : ''}`;
      if (cur && cur.kind === 'ladder') g = 'Tap one of your units on a start space to give it this ladder. Walk it up to a wall, then use "Place ladder".';
      if (cur && cur.kind === 'equip') g = `Tap one of your units to equip: ${tr(CARDS[cur.card].tip)}`;
      $('#panel').innerHTML = `<div class="guide">${g}</div>
        <div class="row">${items.map((b, i) => `<button class="btn small" data-i="${i}" style="${i === selIdx ? 'border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)' : ''}">${esc(lbl(b))}</button>`).join('') || '<span class="muted">Everything is deployed.</span>'}</div>
        <button class="btn primary block" id="fin">${items.length ? 'Finish (unplaced units and ladders are refunded, unused gear is lost)' : 'Finish deploying'}</button>
        <div class="muted" style="font-size:13px">Gold: ${S.ps[s].gold}</div>`;
      $('#panel').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { selIdx = +b.dataset.i; setSpots(); render(); });
      $('#fin').onclick = () => {
        for (let i = S.bought[s].length - 1; i >= 0; i--) { const b = S.bought[s][i]; if (b.kind === 'unit' || b.kind === 'ladder') { S.ps[s].gold += b.cost; if (b.card) S.ps[s].hand.push(b.card); S.bought[s].splice(i, 1); } }
        done();
      };
    };
    UIX.onBoard = async (node) => {
      if (selIdx < 0 || !UIX.spots.includes(node)) return;
      const b = S.bought[s][selIdx];
      UIX.busy = true;
      try {
        if (b.kind === 'unit') await deployUnit(s, selIdx, node);
        else if (b.kind === 'ladder') giveLadder(s, unitAt(node));
        else if (b.kind === 'equip') equipUnit(s, selIdx, unitsAt(node).find(u => u.owner === s));
      } finally { UIX.busy = false; }
      guard(gen);
      const items = S.bought[s];
      selIdx = items.length ? Math.min(Math.max(selIdx, 0), items.length - 1) : -1;
      if (selIdx >= 0) setSpots(); else clearHL();
      render();
    };
    if (S.bought[s].length) { selIdx = 0; setSpots(); }
    render();
  }).then(() => guard(gen));
}

// --- player turn ---
function attackOdds(u, t) {
  if (t.wall) { const w = S.walls[t.wall]; const e = AI.expectedHits(def(u).structAtk || stats(u).atk, 0); return `Expect about ${e.toFixed(1)} damage. The wall has ${w.hp - w.dmg} health left. Walls never strike back.`; }
  if (t.bldg) return `Buildings have 2 health (${2 - S.buildings[t.bldg].dmg} left) and never strike back.`;
  const x = S.units[t.unit];
  const lv = S.seats[u.owner].ctrl; S.seats[u.owner].ctrl = 'hard';
  const r = AI.simAttack(u, u.node, x, t.bonus || 0);
  S.seats[u.owner].ctrl = lv;
  const D = battleSide(x, u, attackMode(u, x), false, false, false);
  return `About ${Math.round(r.kill * 100)}% to destroy it (avg ${r.dealt.toFixed(1)} damage).${D.canCounter ? ` It will strike back: you take ~${r.taken.toFixed(1)} (${Math.round(r.die * 100)}% you die).` : ' It cannot strike back.'}${D.cover ? ` It has cover +${D.cover}.` : ''}${x.skelSaved && x.flipped ? ' It is a heap of bones: attacking destroys it.' : ''}`;
}
function targetLabel(t) {
  if (t.wall) return `${NODES[t.wall].kind === 'kg' ? 'Keep wall' : 'Wall'} (${S.walls[t.wall].hp - S.walls[t.wall].dmg}❤)`;
  if (t.bldg) return EVENTS[S.buildings[t.bldg].type].name;
  const x = S.units[t.unit]; return x ? `${def(x).glyph} ${def(x).name}` : 'target';
}
async function showRecap(s) {
  const from = S.seen[s] === undefined ? null : S.seen[s];
  const base = S.logBase || 0;
  S.seen[s] = base + S.log.length;
  if (from === null) return;
  const lines = S.log.slice(Math.max(0, from - base));
  if (lines.length < 3) return;
  const key = lines.filter(l => ['big', 'kill', 'event', 'card'].includes(l.cls) || /destroyed!|wall/i.test(l.msg));
  const kills = lines.filter(l => l.cls === 'kill' && /is destroyed/.test(l.msg)).length;
  const walls = lines.filter(l => /— destroyed!/.test(l.msg)).length;
  const evs = lines.filter(l => l.cls === 'event').length;
  promptStart();
  const gen = GEN;
  await new Promise(res => {
    const sh = sheet(`<h2>Since your last turn</h2>
      <div class="stat-line"><span class="chip">⚔️ ${kills} units lost</span><span class="chip">🧱 ${walls} wall${walls === 1 ? '' : 's'} down</span><span class="chip">📜 ${evs} event${evs === 1 ? '' : 's'}</span></div>
      <div class="recap">${key.slice(-18).map(l => `<div class="logline ${l.cls}">${esc(l.msg)}</div>`).join('') || '<div class="muted">Quiet times.</div>'}</div>
      <details><summary class="muted">Everything (${lines.length} lines)</summary>${lines.map(l => `<div class="logline ${l.cls}">${esc(l.msg)}</div>`).join('')}</details>
      <button class="btn primary block" id="ok">To my turn</button>`);
    sh.el.querySelector('#ok').onclick = () => { sh.close(); res(); };
  });
  guard(gen);
}

const TYPE_ICON = { Champion: '👑', Upgrade: '🏛️', Equipment: '⚙️', Magic: '✨', Action: '⚡', 'Common Action': '⚔️', Boss: '🎩', Event: '📜' };
function cardInfo(key, kind) {
  if (kind === 'boss') { const C = BOSS_CARDS[key]; return { C, name: C.name, type: 'Boss', color: '#f0a63a', dark: '#6b4512', art: artFor('boss-' + key), army: 'Boss' }; }

  const C = CARDS[key], A = ARMIES[C.army];
  return { C, name: C.name, type: C.type, color: A ? A.color : '#d9c99a', dark: A ? A.dark : '#5c5236', art: artFor('card-' + key), army: A ? A.name : (LANG.cur === 'nl' ? 'Alle legers' : 'Every army') };
}
function cardEmblem(key, kind, I) {
  let g = TYPE_ICON[I.type] || '🃏';
  if (kind === 'card' && I.C.champ) g = ARMIES[I.C.army].units.champ.glyph;
  else if (kind === 'card' && I.C.equip && EQUIP[I.C.equip]) g = EQUIP[I.C.equip].glyph;
  else if (kind === 'event' && BUILDING_GLYPH[key]) g = BUILDING_GLYPH[key];

}
function costBadges(key, kind, s) {
  if (kind !== 'card') return kind === 'boss' ? `<span class="cb free">${LANG.cur === 'nl' ? 'gratis' : 'free'}</span>` : '';
  const g = s !== undefined && s !== null ? cardGold(s, key) : CARDS[key].gold || 0, m = s !== undefined && s !== null ? cardMagic(s, key) : CARDS[key].magic || 0;

const WHEN_TXT = { turn: ['Your turn', 'Jouw beurt'], buy: ['Buy phase', 'Koopfase'], react: ['Reaction', 'Reactie'], bid: ['Boss vote', 'Boss-stemming'] };

function cardWhy(s, key, boss) {
  const P = S.ps[s], C = boss ? BOSS_CARDS[key] : CARDS[key];
  const ok = boss ? bossPlayable(s, key) : cardPlayable(s, key);

    else if (C.when === 'bid') why = 'Played during the Boss vote.';
    else if (!inHandReady(s, key)) why = 'Exhausted until next turn.';
    else if (cardGold(s, key) > P.gold) why = 'Not enough gold.';

        h += segBtns('white', Array.from({ length: W + 1 }, (_, i) => [String(i), W === 1 ? (i ? 'Hit ⚔' : (nl ? 'Mis' : 'Miss')) : String(i)]));
      }

      h += `<div class="grid2"><button class="btn" id="dapp">${nl ? 'Laat de app gooien' : 'Let the app roll'}</button><button class="btn primary" id="dok" ${ready ? '' : 'disabled'}>${nl ? 'Klaar' : 'Done'}</button></div>`;
      sh.el.innerHTML = h;
      sh.el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { st[b.dataset.k] = b.dataset.v; draw(); });
      sh.el.querySelector('#dapp').onclick = () => { sh.close(); res(q.t === 'atk' ? rollAttack(q.n, q.extra, q.opts) : rollDefense(q.k)); };
      sh.el.querySelector('#dok').onclick = () => {
        sh.close();
        const wh = +(st.white || 0);
        const whites = Array.from({ length: W }, (_, i) => i < wh);
        if (q.t !== 'atk') return res(whites);
        const ex = st.red === 'crit' ? +(st.extra || 0) : 0;
        const crit = st.red === 'crit' ? [0, 1, 2].map(i => i < ex) : [];
        res({ burst: st.red, battle: whites, crit, rerolls: 0, hits: (st.red !== 'miss' ? 1 : 0) + wh + ex, physical: true });
      };
    };
    draw();
  }).then(v => { guard(gen); return v; });
}

function recordGame() {

  r.games++;

    x.played++;

    const mine = sc.find(o => o.s === s); if (mine) x.best = Math.max(x.best, mine.sc);
  }
  if (S.opts.defHuman) { r.castle.played++; if (S.winner === 'D') r.castle.won++; }

}

async function asCastle(purpose) { promptStart(); if (multiHuman() && UIX.holder !== 'D') await handoff('D', purpose); }
// generic "tap something on the board" prompt; resolves {node} | {unit} | a button object
function boardPick(o) {
  const gen = GEN;
  return new Promise(res => {
    const prev = { mode: UIX.mode, panelFn: UIX.panelFn, onBoard: UIX.onBoard, sel: UIX.sel };
    clearHL(); UIX.mode = 'castle';
    UIX.spots = [...(o.spots || []), ...(o.mark || [])]; UIX.targets = (o.units || []).map(id => ({ unit: id }));
    UIX.sel = o.sel || null;
    const done = v => { clearHL(); UIX.sel = prev.sel; UIX.panelFn = prev.panelFn; UIX.onBoard = prev.onBoard; UIX.mode = prev.mode; render(); res(v); };
    UIX.panelFn = () => {
      $('#panel').innerHTML = `<div class="castle-bar">🏰 ${esc(castleName())}${o.title ? ' · ' + esc(o.title) : ''}</div><div class="guide">${o.guide}</div>${o.extra || ''}<div style="display:grid;gap:6px">${(o.buttons || []).map((b, i) => `<button class="btn ${b.primary ? 'primary' : ''} block" data-bp="${i}">${esc(b.label)}</button>`).join('')}</div>`;
      $('#panel').querySelectorAll('[data-bp]').forEach(b => b.onclick = () => done(o.buttons[+b.dataset.bp]));
    };
    UIX.onBoard = (node, unitId) => {
      if (unitId && (o.units || []).includes(unitId)) return done({ unit: unitId });
      if (node && (o.spots || []).includes(node)) return done({ node });
    };
    render();
  }).then(v => { guard(gen); return v; });
}

  const r = await boardPick({ title: what, guide: info.keep ? 'An invader is within 3 spaces of the empty Keep: one of these defenders <b>must</b> rush into the Keep. Tap it.' : 'Tap the defender that moves and attacks. Each defender can act once per march.', units: pool.map(d => d.id), buttons: info.keep ? [] : [{ label: 'End the march here', v: 'end' }] });

async function humanDefPlan(d, o) {
  await asCastle('Onward March');
  const D = def(d), reach = DEF.reach(d);
  let dests = Object.keys(reach).filter(n => !DEF.keepRule(d, n));
  if (o.forceKeep) dests = [KEEP];
  const spellTxt = d._spells ? `<br>Spells drawn: <b>${d._spells.map(k => esc(DEF_SPELLS[k].name)).join(', ')}</b>.` : '';
  for (;;) {
    const r = await boardPick({ title: 'Onward March', sel: d.id, guide: `<b>${D.glyph} ${esc(D.name)}</b>: tap where it moves (up to ${Math.max(0, stats(d).mv - (d.flipped ? 1 : 0))} spaces; its own space = stay).${spellTxt}`, spots: dests, buttons: o.forceKeep ? [] : [{ label: 'Skip this defender', v: 'skip' }] });
    if (!r || r.v === 'skip') return null;
    const dest = r.node || (r.unit && S.units[r.unit] && S.units[r.unit].node);
    if (!dest) continue;
    const mvLeft = stats(d).mv - reach[dest] - (d.flipped ? 1 : 0);
    const opts = [];
    const atkT = DEF.targetsFrom(d, dest);
    if (atkT.length) opts.push({ label: `⚔ Attack (${atkT.length} target${atkT.length > 1 ? 's' : ''} in reach)`, v: 'atk' });
    for (const sk of d._spells || []) {
      const sp = DEF_SPELLS[sk]; if (sp.miscast) continue;
      if (DEF.spellTargets(d, dest, sk, null).length || (d.type === 'wizard' && DEF.spellTargets(d, dest, sk, 'range').length)) opts.push({ label: `✨ Cast ${sp.name}`, sub: tr(sp.tip), v: 'sp:' + sk });
    }
    if (d.type === 'paladin') { const adj = Object.values(S.units).filter(t => t.owner !== 'D' && t.type !== 'peasant' && NB[dest].includes(t.node) && !wallBetween(dest, t.node)); if (adj.length) opts.push({ label: `✝ Holy Nova (${adj.length} next to him)`, sub: 'Instead of attacking: every adjacent invader not behind a wall takes 1 damage. No counterattack.', v: 'nova' }); }
    if (mvLeft >= 1 && S.walls[dest] && wallIntact(dest) && ladderAt(wallFront(dest))) opts.push({ label: '🪜 Kick the ladder off the wall', sub: 'Costs 1 move. A unit on it takes Attack 1.', v: 'ladder' });
    opts.push({ label: dest === d.node ? 'Stay and do nothing' : 'Just move there', v: 'none' });
    opts.push({ label: '↩ Pick another space', v: 'back' });
    const ch = await choose(D.name, 'What does it do there?', opts, { cancel: false });
    if (ch === 'back') continue;
    const plan = { dest, mvLeft, attacks: true };
    if (ch === 'none') return plan;
    if (ch === 'nova') return { ...plan, nova: true };
    if (ch === 'ladder') return { ...plan, ladder: wallFront(dest), mvLeft: mvLeft - 1 };
    if (ch === 'atk') {
      const t = await boardPick({ title: 'Attack', guide: `Tap the invader the ${esc(D.name)} attacks from the marked space.`, units: atkT.map(u => u.id), mark: [dest], sel: d.id, buttons: [{ label: '↩ Back', v: 'back' }] });
      if (!t || !t.unit) continue;
      return { ...plan, target: t.unit };
    }
    if (ch.startsWith('sp:')) {
      const sk = ch.slice(3);
      let boost = null;
      if (d.type === 'wizard') boost = await choose('Wizard Lord', 'Boost the spell:', [{ label: '+1 attack', v: 'atk' }, { label: '+1 range', v: 'range' }, { label: '+1 damage', v: 'dmg' }], { cancel: false });
      const ts = DEF.spellTargets(d, dest, sk, boost);
      if (!ts.length) { toast('No target in range for that spell.'); continue; }
      const t = await boardPick({ title: DEF_SPELLS[sk].name, guide: `Tap the target of ${esc(DEF_SPELLS[sk].name)}.`, units: ts, mark: [dest], sel: d.id, buttons: [{ label: '↩ Back', v: 'back' }] });
      if (!t || !t.unit) continue;
      return { ...plan, spell: sk, boost, target: t.unit };
    }
  }
}
